<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>State Path Search</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #14161c;
    --surface: #1b1e27;
    --surface-raised: #232733;
    --border: #2b2f3c;
    --border-soft: #23262f;
    --text: #e7e9f0;
    --text-dim: #9297ab;
    --text-faint: #5d6175;
    --accent: #7dd3c0;
    --accent-dim: #4f8f82;
    --accent-soft: rgba(125, 211, 192, 0.12);
    --path: #e8a978;
    --path-soft: rgba(232, 169, 120, 0.16);
    --scrollbar: #343849;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    user-select: none;
  }

  .search-box input {
    user-select: text;
  }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Page chrome (search, tabs, node header) stays fixed; only the active
     tab's/column's own body scrolls, in both narrow and wide layouts. */
  html, body { height: 100vh; overflow: hidden; }
  .page {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 24px 24px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .page-head, .search-box, .search-results, .node-name, .node-meta, .detail-tabs {
    flex: none;
  }
  #detail { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .detail-columns {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    margin-top: 8px;
  }
  .detail-col {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .detail-col .section-label { flex: none; }
  .detail-col .section-label:first-of-type { margin-top: 0; }
  .detail-col-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
  }

  /* Narrow layout only: two tabs (Keys | Fields) switch which detail-col is
     shown, since there's no room for the wide layout's side-by-side columns. */
  .detail-tabs {
    display: flex;
    gap: 4px;
    margin-top: 28px;
    border-bottom: 1px solid var(--border);
  }
  .detail-tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-faint);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 4px 10px;
    margin-bottom: -1px;
    cursor: pointer;
  }
  .detail-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .detail-columns[data-active-tab="routes"] .detail-col-fields { display: none; }
  .detail-columns[data-active-tab="fields"] .detail-col-routes { display: none; }

  #scrollTop {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
    transition: opacity 150ms, transform 150ms;
    z-index: 10;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
  }
  #scrollTop.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
  #scrollTop:hover { color: var(--accent); border-color: var(--accent-dim); }
  #scrollTop svg { width: 18px; height: 18px; }

  /* Wide layout: tabs give way to two side-by-side columns, each still
     scrolling within its own bounded body (set up in the base rules above).
     No single "current tab" exists to scroll to top, so the button hides. */
  @media (min-width: 1100px) {
    #scrollTop { display: none; }
    .detail-tabs { display: none; }
    .detail-columns .detail-col { display: flex !important; }
    .page { max-width: none; padding: 32px 64px 24px; }
    .detail-columns {
      display: grid;
      grid-template-columns: 7fr 3fr;
      gap: 24px;
    }
  }

  .page-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 18px;
  }

  .page-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text);
    margin: 0;
  }

  .stat-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 11.5px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .stat-pill b { color: var(--text); font-weight: 600; }

  .search-box {
    position: relative;
  }

  .search-box input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px 14px 42px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    outline: none;
  }
  .search-box input:focus { border-color: var(--accent-dim); }
  .search-box input::placeholder { color: var(--text-faint); }

  .search-icon {
    position: absolute;
    display: block;
    left: 14px;
    top: 16px;
    width: 18px;
    height: 18px;
    color: var(--text-faint);
    pointer-events: none;
  }

  .search-results {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .search-result {
    padding: 9px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
  }
  .search-result:hover, .search-result.active { background: var(--surface); }
  .search-result .kind-tag {
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    flex: none;
  }
  .search-result mark {
    background: none;
    color: var(--accent);
    font-weight: 700;
  }

  .hint {
    color: var(--text-faint);
    font-size: 12.5px;
    padding: 10px 12px;
  }

  #detail {
    margin-top: 28px;
  }

  .empty-state {
    color: var(--text-faint);
    font-size: 13.5px;
    line-height: 1.7;
    padding-top: 8px;
  }
  .empty-state code {
    font-family: 'JetBrains Mono', monospace;
    background: var(--surface-raised);
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 12.5px;
    color: var(--accent);
  }

  .node-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 23px;
    font-weight: 700;
    color: var(--text);
    word-break: break-word;
    text-wrap: balance;
  }

  .node-meta {
    display: flex;
    gap: 16px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .node-meta span b { color: var(--text); font-weight: 600; }

  .section-label {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--bg);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 26px 0 10px;
    padding: 6px 0;
  }
  .section-label:first-of-type { margin-top: 28px; }

  .route-count-badge {
    display: inline-block;
    background: var(--path-soft);
    color: var(--path);
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 10.5px;
    font-weight: 600;
    margin-left: 6px;
  }

  .route-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .route {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    padding: 8px 12px;
    border-radius: 8px;
    word-break: break-all;
  }
  .route .seg { color: var(--text-dim); }

  .route.alias-route {
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .route.alias-route .seg { color: var(--accent); font-weight: 600; }

  [data-copy] { cursor: copy; }
  [data-copy]:hover { background: var(--accent-soft) !important; }

  .alias-badge {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .prop-name .alias-badge { margin-left: 7px; }

  .prop-list {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    overflow: hidden;
  }

  .prop-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 12px;
    background: var(--surface-raised);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    align-items: baseline;
  }
  .prop-row + .prop-row {
    border-top: 1px solid var(--border-soft);
  }

  .prop-name { color: var(--text); flex: none; }
  .prop-type {
    color: var(--text-faint);
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .prop-type.node { color: var(--accent); }
  .prop-type.node.linked {
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: transparent;
  }
  .prop-type.node.linked:hover {
    text-decoration-color: var(--accent);
  }

  .no-results {
    color: var(--text-faint);
    font-size: 13px;
    padding: 8px 12px;
  }

  [data-copy].copy-flash {
    background: var(--accent-soft) !important;
    color: var(--accent);
  }
  [data-copy].copy-flash .seg,
  [data-copy].copy-flash .prop-name {
    color: var(--accent);
  }
  [data-copy] .copy-hint {
    display: none;
    margin-left: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--accent);
    flex: none;
  }
  [data-copy].copy-flash .copy-hint { display: inline; }
</style>
</head>
<body>

<div class="page">
  <div class="page-head">
    <p class="page-title">State path search</p>
    <div class="stat-pill"><b id="nodeCountStat">0</b> types &middot; <b id="edgeCountStat">0</b> links</div>
  </div>

  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="UnityZodiac, NextZodiacs, sign..." autocomplete="off" spellcheck="false">
  </div>
  <div class="search-results" id="searchResults"></div>

  <div id="detail">
    <div class="empty-state" id="emptyState">
      Search for a gameplay type, a field name, or a compatibility alias to see every path from <code>GameData</code> that reaches it.
    </div>
  </div>
</div>

<button id="scrollTop" type="button" title="Scroll to top" aria-label="Scroll to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
</button>

<script>
(function () {
  const GRAPH = __GRAPH_JSON__;

  const nodeIds = new Set(GRAPH.nodes.map(n => n.id));
  const outEdges = new Map();
  const inEdges = new Map();
  for (const id of nodeIds) { outEdges.set(id, []); inEdges.set(id, []); }
  const leafProps = new Map();
  for (const id of nodeIds) leafProps.set(id, []);

  for (const e of GRAPH.edges) {
    if (e.to && nodeIds.has(e.to)) {
      outEdges.get(e.from).push(e);
      inEdges.get(e.to).push(e);
    } else {
      if (!leafProps.has(e.from)) leafProps.set(e.from, []);
      leafProps.get(e.from).push(e);
    }
  }

  document.getElementById('nodeCountStat').textContent = GRAPH.nodes.length;
  document.getElementById('edgeCountStat').textContent = GRAPH.edges.filter(e => e.to).length;

  // Resolve each compatibility alias's dotted canonical path against the edge
  // graph so it can be surfaced as a shortcut alongside real routes/fields.
  const aliasesByOwner = new Map();   // node id -> [{alias, path, property}]  (alias resolves to a scalar field on that node)
  const aliasesByTarget = new Map();  // node id -> [{alias, path}]            (alias resolves straight to that node)
  for (const id of nodeIds) { aliasesByOwner.set(id, []); aliasesByTarget.set(id, []); }
  for (const a of GRAPH.aliases || []) {
    const segments = a.path.split('.');
    let cur = GRAPH.root;
    let finalEdge = null;
    let ok = true;
    for (const seg of segments) {
      const e = (outEdges.get(cur) || []).find(edge => edge.property === seg) ||
                (leafProps.get(cur) || []).find(edge => edge.property === seg);
      if (!e) { ok = false; break; }
      finalEdge = e;
      cur = e.to;
      if (!cur) break;
    }
    if (!ok || !finalEdge) continue;
    if (finalEdge.to && nodeIds.has(finalEdge.to)) {
      aliasesByTarget.get(finalEdge.to).push({ alias: a.alias, path: a.path });
    } else {
      aliasesByOwner.get(finalEdge.from).push({ alias: a.alias, path: a.path, property: finalEdge.property });
    }
  }

  function collectionSegment(edge) {
    if (edge.kind === 'list') return edge.property + '.<n>';
    if (edge.kind === 'dict') return edge.property + '.<key>';
    return edge.property;
  }

  // Enumerate every simple path GameData -> target, stopping a branch the moment
  // it revisits a type already on that branch (cycles terminate, don't loop forever).
  function findAllRoutes(targetId) {
    const routes = [];
    const chain = new Set();
    function walk(nodeId, path) {
      if (nodeId === targetId && path.length > 0) {
        routes.push(path.slice());
        return;
      }
      if (chain.has(nodeId)) return;
      chain.add(nodeId);
      for (const e of outEdges.get(nodeId) || []) {
        path.push(e);
        walk(e.to, path);
        path.pop();
      }
      chain.delete(nodeId);
    }
    walk(GRAPH.root, []);
    return routes;
  }

  function routeKey(route) {
    return route.map(collectionSegment).join('.');
  }

  function routeHtml(route) {
    const key = routeKey(route);
    return '<div class="route" data-copy="' + escapeHtml(key) + '"><span class="seg">' + escapeHtml(key) + '</span><span class="copy-hint">copied</span></div>';
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderDetail(nodeId) {
    const currentRoutes = findAllRoutes(nodeId).sort((a, b) => a.length - b.length);

    const outs = (outEdges.get(nodeId) || []).slice().sort((a, b) => a.property.localeCompare(b.property));
    const ins = (inEdges.get(nodeId) || []).slice().sort((a, b) => a.from.localeCompare(b.from) || a.property.localeCompare(b.property));
    const leaves = (leafProps.get(nodeId) || []).slice().sort((a, b) => a.property.localeCompare(b.property));
    const nodeAliases = (aliasesByTarget.get(nodeId) || []).slice().sort((a, b) => a.alias.localeCompare(b.alias));
    const fieldAliasByProperty = new Map();
    for (const a of aliasesByOwner.get(nodeId) || []) fieldAliasByProperty.set(a.property, a);

    const detail = document.getElementById('detail');
    let html = '';
    html += '<div class="node-name">' + escapeHtml(nodeId) + '</div>';
    html += '<div class="node-meta">';
    html += '<span><b>' + (currentRoutes.length + nodeAliases.length || (nodeId === GRAPH.root ? 1 : 0)) + '</b> route' + (currentRoutes.length + nodeAliases.length === 1 ? '' : 's') + '</span>';
    html += '<span><b>' + outs.length + '</b> refs out</span>';
    html += '<span><b>' + ins.length + '</b> refs in</span>';
    html += '<span><b>' + leaves.length + '</b> scalar fields</span>';
    html += '</div>';

    html += '<div class="detail-tabs">';
    html += '<button type="button" class="detail-tab active" data-tab="routes">Keys</button>';
    html += '<button type="button" class="detail-tab" data-tab="fields">Fields</button>';
    html += '</div>';

    html += '<div class="detail-columns" data-active-tab="routes">';

    // Routes / keys
    html += '<div class="detail-col detail-col-routes">';
    html += '<div class="detail-col-body">';
    html += '<div class="section-label">Routes from GameData<span class="route-count-badge">' + (currentRoutes.length + nodeAliases.length) + '</span></div>';
    if (nodeId === GRAPH.root) {
      html += '<div class="no-results">This is the root of the state tree.</div>';
    } else if (currentRoutes.length === 0 && nodeAliases.length === 0) {
      html += '<div class="no-results">No route found (unexpected).</div>';
    } else {
      let routesHtml = '';
      for (const a of nodeAliases) {
        routesHtml += '<div class="route alias-route" data-copy="' + escapeHtml(a.alias) + '"><span class="alias-badge">alias</span><span class="seg">' + escapeHtml(a.alias) + '</span><span class="copy-hint">copied</span></div>';
      }
      routesHtml += currentRoutes.map(routeHtml).join('');
      html += '<div class="route-list">' + routesHtml + '</div>';
    }
    html += '</div></div>';

    // Fields (scalar fields + references out, stacked in one scrolling column)
    html += '<div class="detail-col detail-col-fields">';
    html += '<div class="detail-col-body">';
    html += '<div class="section-label">Scalar fields</div>';
    if (leaves.length) {
      html += '<div class="prop-list">' + leaves.map(e => {
        const alias = fieldAliasByProperty.get(e.property);
        const aliasBadge = alias ? '<span class="alias-badge" title="shortcut for ' + escapeHtml(e.property) + '">' + escapeHtml(alias.alias) + '</span>' : '';
        return '<div class="prop-row" data-copy="' + escapeHtml(e.property) + '"><span class="prop-name">' + escapeHtml(e.property) + aliasBadge + '<span class="copy-hint">copied</span></span><span class="prop-type">' + escapeHtml(e.valueType) + '</span></div>';
      }).join('') + '</div>';
    } else {
      html += '<div class="no-results">None</div>';
    }
    html += '<div class="section-label">References out</div>';
    if (outs.length) {
      html += '<div class="prop-list">' + outs.map(e => {
        const seg = collectionSegment(e);
        return '<div class="prop-row" data-copy="' + escapeHtml(seg) + '"><span class="prop-name">' + escapeHtml(seg) + '<span class="copy-hint">copied</span></span><span class="prop-type node linked" data-target="' + escapeHtml(e.to) + '">' + escapeHtml(e.to) + '</span></div>';
      }).join('') + '</div>';
    } else {
      html += '<div class="no-results">None</div>';
    }
    html += '<div class="section-label">References in</div>';
    if (ins.length) {
      html += '<div class="prop-list">' + ins.map(e => {
        const seg = collectionSegment(e);
        const fullPath = e.from + '.' + seg;
        return '<div class="prop-row" data-copy="' + escapeHtml(fullPath) + '"><span class="prop-name">' + escapeHtml(seg) + '<span class="copy-hint">copied</span></span><span class="prop-type node linked" data-target="' + escapeHtml(e.from) + '">' + escapeHtml(e.from) + '</span></div>';
      }).join('') + '</div>';
    } else {
      html += '<div class="no-results">None</div>';
    }
    html += '</div></div>';

    html += '</div>';

    detail.innerHTML = html;

    detail.querySelectorAll('[data-copy]').forEach(el => {
      el.addEventListener('click', evt => {
        if (evt.target.closest('.linked')) return;
        copyToClipboard(el.getAttribute('data-copy'), el);
      });
    });

    detail.querySelectorAll('.linked').forEach(el => {
      el.addEventListener('click', evt => {
        evt.stopPropagation();
        selectNode(el.getAttribute('data-target'));
      });
    });

    detail.querySelectorAll('.detail-tab').forEach(el => {
      el.addEventListener('click', () => {
        const tab = el.getAttribute('data-tab');
        detail.querySelectorAll('.detail-tab').forEach(t => t.classList.toggle('active', t === el));
        detail.querySelector('.detail-columns').setAttribute('data-active-tab', tab);
        const active = visibleColBody();
        scrollTopBtn.classList.toggle('visible', !!active && active.scrollTop > 400);
      });
    });

    detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  let copyFlashTimer = null;

  async function copyToClipboard(text, el) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch {}
      document.body.removeChild(ta);
    }
    document.querySelectorAll('[data-copy].copy-flash').forEach(x => x.classList.remove('copy-flash'));
    el.classList.add('copy-flash');
    clearTimeout(copyFlashTimer);
    copyFlashTimer = setTimeout(() => el.classList.remove('copy-flash'), 900);
  }

  function selectNode(nodeId) {
    searchInput.value = nodeId;
    searchResults.innerHTML = '';
    searchResults.classList.remove('open');
    renderDetail(nodeId);
    const params = new URLSearchParams(location.search);
    params.set('select', nodeId);
    history.replaceState(null, '', '?' + params.toString());
  }

  // Search
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');

  function buildSearchIndex() {
    const items = [];
    for (const id of nodeIds) items.push({ label: id, sub: 'type', target: id });
    const seenProps = new Set();
    for (const e of GRAPH.edges) {
      const key = e.property + ' ' + e.from;
      if (seenProps.has(key)) continue;
      seenProps.add(key);
      items.push({ label: e.property, sub: e.from, target: e.to || e.from, isField: true, fieldOwner: e.from });
    }
    for (const id of nodeIds) {
      for (const a of aliasesByTarget.get(id) || []) items.push({ label: a.alias, sub: a.path, target: id, isAlias: true, fieldOwner: id });
      for (const a of aliasesByOwner.get(id) || []) items.push({ label: a.alias, sub: a.path, target: id, isAlias: true, fieldOwner: id });
    }
    return items;
  }
  const searchIndex = buildSearchIndex();

  // Fuzzy subsequence match: every query character must appear in the label
  // in order, not necessarily contiguous ("UniZod" matches "UnityZodiac").
  // Returns null on no match, or a score (lower is better) plus matched index
  // positions so the UI can highlight them.
  function fuzzyMatch(label, query) {
    const text = label.toLowerCase();
    let ti = 0;
    const positions = [];
    let gapPenalty = 0;
    let lastMatch = -1;
    for (let qi = 0; qi < query.length; qi++) {
      const ch = query[qi];
      const idx = text.indexOf(ch, ti);
      if (idx === -1) return null;
      if (lastMatch !== -1) gapPenalty += idx - lastMatch - 1;
      positions.push(idx);
      lastMatch = idx;
      ti = idx + 1;
    }
    const score = gapPenalty * 10 + positions[0] + (label.length - query.length) * 0.1;
    return { score, positions };
  }

  function highlightMatch(label, positions) {
    const posSet = new Set(positions);
    let html = '';
    for (let i = 0; i < label.length; i++) {
      const ch = escapeHtml(label[i]);
      html += posSet.has(i) ? '<mark>' + ch + '</mark>' : ch;
    }
    return html;
  }

  let currentMatches = [];
  let activeResultIdx = -1;

  function setActiveResult(idx) {
    const rows = searchResults.querySelectorAll('.search-result');
    if (!rows.length) { activeResultIdx = -1; return; }
    activeResultIdx = Math.max(0, Math.min(idx, rows.length - 1));
    rows.forEach((el, i) => el.classList.toggle('active', i === activeResultIdx));
    rows[activeResultIdx].scrollIntoView({ block: 'nearest' });
  }

  function chooseResult(idx) {
    const m = currentMatches[idx]?.item;
    if (!m) return;
    selectNode(m.isField ? m.fieldOwner : m.target);
  }

  function runSearch(query) {
    const q = query.trim().toLowerCase();
    activeResultIdx = -1;
    if (!q) { searchResults.classList.remove('open'); searchResults.innerHTML = ''; currentMatches = []; return; }
    const scored = [];
    for (const item of searchIndex) {
      const m = fuzzyMatch(item.label, q);
      if (m) scored.push({ item, score: m.score, positions: m.positions });
    }
    scored.sort((a, b) => a.score - b.score);
    currentMatches = scored.slice(0, 40);
    if (!currentMatches.length) {
      searchResults.innerHTML = '<div class="hint">No matches</div>';
      searchResults.classList.add('open');
      return;
    }
    searchResults.innerHTML = currentMatches.map(({ item, positions }) => {
      const tag = item.isAlias ? 'alias for ' + item.sub : item.isField ? 'field on ' + item.sub : 'type';
      return '<div class="search-result"><span>' + highlightMatch(item.label, positions) + '</span><span class="kind-tag">' + escapeHtml(tag) + '</span></div>';
    }).join('');
    searchResults.classList.add('open');
    searchResults.querySelectorAll('.search-result').forEach((el, i) => {
      el.addEventListener('mouseenter', () => setActiveResult(i));
      el.addEventListener('click', () => chooseResult(i));
    });
  }

  searchInput.addEventListener('input', () => runSearch(searchInput.value));
  searchInput.addEventListener('keydown', evt => {
    if (!currentMatches.length) return;
    if (evt.key === 'ArrowDown') {
      evt.preventDefault();
      setActiveResult(activeResultIdx === -1 ? 0 : activeResultIdx + 1);
    } else if (evt.key === 'ArrowUp') {
      evt.preventDefault();
      setActiveResult(activeResultIdx === -1 ? currentMatches.length - 1 : activeResultIdx - 1);
    } else if (evt.key === 'Enter') {
      evt.preventDefault();
      chooseResult(activeResultIdx === -1 ? 0 : activeResultIdx);
    } else if (evt.key === 'Escape') {
      searchResults.classList.remove('open');
      searchResults.innerHTML = '';
      currentMatches = [];
      activeResultIdx = -1;
    }
  });

  document.addEventListener('click', evt => {
    if (!evt.target.closest('.search-box') && !evt.target.closest('.search-results')) {
      searchResults.classList.remove('open');
    }
  });

  const preselect = new URLSearchParams(location.search).get('select');
  if (preselect && nodeIds.has(preselect)) selectNode(preselect);

  // Scroll-to-top (narrow layout only; hidden entirely in wide mode via CSS,
  // where two columns scroll independently with no single "current" one).
  // The page itself never scrolls now -- only the active tab's own body
  // does -- so this tracks whichever .detail-col-body is visible and not
  // display:none, rebinding via delegation since renderDetail replaces the
  // whole #detail subtree (and its scroll containers) on every selection.
  const scrollTopBtn = document.getElementById('scrollTop');

  function visibleColBody() {
    return [...document.querySelectorAll('.detail-col-body')]
      .find(el => el.offsetParent !== null);
  }

  document.getElementById('detail').addEventListener('scroll', evt => {
    if (!evt.target.classList || !evt.target.classList.contains('detail-col-body')) return;
    scrollTopBtn.classList.toggle('visible', evt.target.scrollTop > 400);
  }, { passive: true, capture: true });

  scrollTopBtn.addEventListener('click', () => {
    const el = visibleColBody();
    if (el) el.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
</body>
</html>
